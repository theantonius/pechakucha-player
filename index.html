<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PechaKucha Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column. Paste bar on top, 16:9 stage below, 20-segment timeline under stage. */
:root {
  --bg: #f3f2ef;
  --surface: #ffffff;
  --fg: #1b1a18;
  --muted: #6b675f;
  --line: #dcd9d2;
  --accent: #e0442b;
  --accent-fg: #ffffff;
  --seg: #d3cfc6;
  --ok: #2f7d4f;
  --stage: #111111;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412; --surface: #1f1d1a; --fg: #efece6; --muted: #a39e94;
    --line: #34312c; --accent: #ff5a3c; --accent-fg: #160a07; --seg: #45413b; --stage: #000; --ok: #6fcf97;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151412; --surface: #1f1d1a; --fg: #efece6; --muted: #a39e94;
  --line: #34312c; --accent: #ff5a3c; --accent-fg: #160a07; --seg: #45413b; --stage: #000; --ok: #6fcf97;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--body);
  padding-inline: 16px; padding-block: 12px 32px;
}
.wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 10px;
  --w: min(100%, calc((100vh - 150px) * 16 / 9)); } /* shared width: slide fits window height */
header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; width: var(--w); justify-self: center; }
h1 { font: 800 clamp(28px, 5vw, 44px)/1 var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.tag { font: 500 12px/1 var(--mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

header form { flex: 1 1 220px; max-width: 640px; display: flex; align-items: flex-end; min-width: 0; margin-right: 6px; }
.field { flex: 1 1 auto; min-width: 0; display: grid; gap: 3px; }
.fieldhead { display: flex; gap: 8px; align-items: baseline; min-width: 0; font-size: 11px; line-height: 1.2; }
.fieldhead label { color: var(--muted); font-weight: 500; letter-spacing: 0.02em; white-space: nowrap; }
#url { border-radius: 6px 0 0 6px; }
#loadBtn { border-radius: 0 6px 6px 0; margin-left: -1px; }
input[type="url"], input[type="number"] {
  width: 100%; font: 14px var(--body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
}
input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button {
  font: 500 14px var(--body); border-radius: 6px; padding: 7px 12px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button:disabled { background: transparent; color: var(--muted); border-color: var(--line); opacity: 0.5; cursor: not-allowed; }
.msg { color: var(--muted); margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg.ok { color: var(--ok); }
.msg.err { color: var(--accent); }
.msg:empty { display: none; }

details { position: relative; font-size: 13px; color: var(--muted); margin-left: auto; }
details .row { color: var(--muted); }
summary { list-style: none; cursor: pointer; white-space: nowrap; font: 500 14px var(--body); color: var(--muted);
  padding: 7px 10px; border: 1px solid transparent; border-radius: 6px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "▾"; margin-left: 6px; font-size: 11px; }
summary:hover, details[open] summary { color: var(--fg); border-color: var(--line); background: var(--surface); }
details .row { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; display: flex; gap: 12px; align-items: flex-end;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); white-space: nowrap; }
details label { display: grid; gap: 4px; }
details input { width: 90px; padding: 6px 8px; }
@media (max-width: 600px) { details .row { flex-wrap: wrap; white-space: normal; width: calc(100vw - 32px); } }
.check { display: flex !important; align-items: center; gap: 8px; }

.stage {
  position: relative; width: var(--w); justify-self: center; aspect-ratio: 16 / 9;
  background: var(--stage); border-radius: 8px; overflow: hidden;
}
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.shield { position: absolute; inset: 0; z-index: 1; } /* blocks clicks into the deck so Space stays with the player */
.empty {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; padding: 24px;
  color: #bdb8ae;
}
.empty b { font: 800 clamp(40px, 9vw, 96px)/0.9 var(--display); color: #f3f2ef; letter-spacing: -0.03em; }
.empty b i { font-style: normal; color: var(--accent); }
.hud {
  position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center;
  font: 500 14px/1 var(--mono); font-variant-numeric: tabular-nums; pointer-events: none;
}
.hud span { background: rgba(0,0,0,0.72); color: #fff; padding: 7px 10px; border-radius: 4px; }
.hud .sec.low { background: var(--accent); color: #fff; }
.stage:fullscreen { border-radius: 0; aspect-ratio: auto; }
.stage:fullscreen .hud { top: 20px; right: 20px; font-size: 18px; }

.timeline { display: grid; grid-template-columns: repeat(var(--n, 20), 1fr); gap: 4px; align-items: center;
  width: var(--w); justify-self: center; }
.timeline div { height: 6px; background: var(--seg); border-radius: 3px; overflow: hidden; }
.timeline div.cur { height: 10px; background: color-mix(in srgb, var(--accent) 30%, var(--seg)); }
.timeline div i { display: block; height: 100%; width: 0; background: var(--accent); }
.timeline div.done i { width: 100%; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls .spacer { flex: 1; }
.hint { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 2px 0 0; justify-self: center; width: var(--w); }
.hint b { color: var(--fg); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.hud { z-index: 3; }
.empty[hidden] { display: none; }
.hud[hidden] { display: none; }
.check input { width: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <form id="form">
      <div class="field">
        <!-- <div class="fieldhead"><label for="url"></label><span class="msg" id="msg" role="status"></span></div> -->
        <input id="url" type="url" required placeholder="https://docs.google.com/presentation/d/…/edit?usp=sharing" autocomplete="off">
      </div>
      <button class="primary" type="submit" id="loadBtn">Load</button>
    </form>
    <button type="button" id="fs" disabled>Fullscreen</button>
    <button type="button" id="play" disabled>Start</button>
    <button type="button" id="restart" disabled>Restart</button>
    <details>
      <summary>Advanced</summary>
      <div class="row">
        <label for="delay">Seconds per slide<input id="delay" type="number" min="3" max="120" value="20"></label>
        <label for="count">Slide count<input id="count" type="number" min="1" max="100" value="20"></label>
        <label class="check" for="hud"><input id="hud" type="checkbox" checked> Show countdown overlay</label>
      </div>
    </details>
  </header>

  <div class="stage" id="stage">
    <div class="empty" id="empty">
        <h1>Pecha<span>Kucha</span> Player</h1>
      <!-- <b>20<i>×</i>20</b> -->
      <!-- <span>Paste a link above. The show starts as soon as the deck loads.</span> -->
    </div>
    <div class="shield" aria-hidden="true"></div>
    <div class="hud" id="hudBox" hidden><span id="slideNo">1 / 20</span><span class="sec" id="secLeft">20</span></div>
  </div>

  <div class="timeline" id="timeline"></div>

  <p class="hint">Deck sharing must be set to: <b>Anyone with the link: Viewer</b><br>
  <!-- The timer starts with Start. If it drifts from Google Slides, use Restart to resync.</p> -->
  </p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $("stage"), empty = $("empty"), hudBox = $("hudBox"), playBtn = $("play");
  let deckBase = "", frame = null, timer = null, startAt = 0;
  let cur = 0;          // slide index (0-based) the current run started from / is paused on
  let playing = false, done = false;

  const cfg = () => ({
    delay: Math.max(3, Math.min(120, parseInt($("delay").value, 10) || 20)),
    count: Math.max(1, Math.min(100, parseInt($("count").value, 10) || 20)),
  });

  // Accepts: /d/ID/edit, /d/ID/view, /d/ID/present, /d/e/2PACX…/pub, /d/e/…/embed
  function toBase(raw) {
    let u;
    try { u = new URL(raw.trim()); } catch { return null; }
    if (!/(^|\.)docs\.google\.com$/.test(u.hostname) || !u.pathname.startsWith("/presentation/")) return null;
    const pub = u.pathname.match(/\/presentation\/d\/e\/([\w-]+)/);
    const reg = u.pathname.match(/\/presentation\/d\/([\w-]{20,})/);
    if (pub) return `https://docs.google.com/presentation/d/e/${pub[1]}/embed`;
    if (reg) return `https://docs.google.com/presentation/d/${reg[1]}/embed`;
    return null;
  }
  // autoplay=true lets Google advance the slides; false holds on the given slide.
  function srcFor(slide, autoplay) {
    return `${deckBase}?start=${autoplay}&loop=false&rm=minimal&delayms=${cfg().delay * 1000}#slide=${slide + 1}`;
  }

  function buildTimeline(n) {
    const t = $("timeline");
    t.style.setProperty("--n", n);
    t.innerHTML = "";
    for (let i = 0; i < n; i++) t.appendChild(document.createElement("div")).appendChild(document.createElement("i"));
  }

  function updateFormat() {
    const { delay, count } = cfg();
    const total = delay * count;
    const f = $("format");
    if (f) f.textContent = `${count} slides × ${delay} sec · ${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
    buildTimeline(count);
  }

  // Draw timeline + HUD for slide idx, frac of it elapsed, left seconds remaining.
  function paint(idx, frac, left) {
    const { count } = cfg();
    const segs = $("timeline").children;
    for (let i = 0; i < segs.length; i++) {
      segs[i].classList.toggle("done", i < idx);
      segs[i].classList.toggle("cur", i === idx);
      segs[i].firstChild.style.width = i === idx ? `${frac * 100}%` : "";
    }
    $("slideNo").textContent = idx >= count ? "Done" : `${idx + 1} / ${count}`;
    $("secLeft").textContent = left;
    $("secLeft").classList.toggle("low", idx < count && left <= 5);
  }

  function tick() {
    const { delay, count } = cfg();
    const elapsed = (performance.now() - startAt) / 1000;
    const idx = cur + Math.floor(elapsed / delay);
    if (idx >= count) { finish(); return; }
    paint(idx, (elapsed % delay) / delay, Math.ceil(delay - (elapsed % delay)));
    timer = requestAnimationFrame(tick);
  }
  function stopClock() { if (timer) cancelAnimationFrame(timer); timer = null; }

  function setFrame(src, onload) {
    frame?.remove();
    const f = document.createElement("iframe");
    f.title = "Google Slides deck";
    f.allowFullscreen = true;
    if (onload) f.addEventListener("load", onload, { once: true });
    f.src = src;
    stage.prepend(f);
    frame = f;
  }

  function setPlayUI() {
    playBtn.disabled = !deckBase;
    playBtn.textContent = playing ? "Stop" : "Start";
    // Highlight the next step: Load deck → Start → Restart + Fullscreen while running
    $("loadBtn").classList.toggle("primary", !deckBase);
    playBtn.classList.toggle("primary", !!deckBase && !playing);
    $("restart").classList.toggle("primary", playing);
    $("fs").classList.toggle("primary", !!deckBase);
  }

  function play() {
    if (!deckBase || playing) return;
    if (done) { cur = 0; done = false; }
    playing = true; startAt = 0;
    setPlayUI();
    paint(cur, 0, cfg().delay);
    // Clock starts when the deck has loaded, so it lines up with Google's timer.
    setFrame(srcFor(cur, true), () => {
      if (!playing) return;
      startAt = performance.now();
      stopClock(); tick();
    });
  }

  // Google's embed can't be paused mid-slide, so pause holds on the current
  // slide and play restarts that slide's full time.
  function pause() {
    if (!playing) return;
    const { delay, count } = cfg();
    if (startAt) cur = Math.min(count - 1, cur + Math.floor((performance.now() - startAt) / 1000 / delay));
    stopClock();
    playing = false; startAt = 0;
    setPlayUI();
    paint(cur, 0, delay);
    setFrame(srcFor(cur, false));
  }

  function finish() {
    stopClock();
    playing = false; done = true; startAt = 0;
    const { count } = cfg();
    paint(count, 0, 0);
    setPlayUI();
    setFrame(srcFor(count - 1, false)); // stop the deck at the last counted slide
  }

  function restart() {
    if (!deckBase) return;
    stopClock();
    playing = false; done = false; cur = 0; startAt = 0;
    setPlayUI();
    paint(0, 0, cfg().delay);
    setFrame(srcFor(0, false));
  }

  // Status text goes in #msg if present; otherwise errors show as the field's built-in tooltip (no pop-up).
  function say(text, cls) {
    const m = $("msg"), url = $("url");
    if (m) { m.textContent = text; m.className = cls; return; }
    url.setCustomValidity(cls.includes("err") ? text : "");
    if (cls.includes("err")) url.reportValidity();
  }

  function load(raw) {
    const base = toBase(raw);
    if (!base) {
      say("That isn't a Google Slides link. Copy it from Share > Copy link in Google Slides.", "msg err");
      return;
    }
    deckBase = base;
    updateFormat();
    restart();
    empty.hidden = true;
    hudBox.hidden = !$("hud").checked;
    ["restart", "fs", "play", "share"].forEach(id => { if ($(id)) $(id).disabled = false; });
    say("✓ Deck loaded", "msg ok");
    try {
      const { delay, count } = cfg();
      const p = new URL(location.href);
      p.searchParams.set("deck", raw.trim());
      if (delay !== 20) p.searchParams.set("sec", delay); else p.searchParams.delete("sec");
      if (count !== 20) p.searchParams.set("n", count); else p.searchParams.delete("n");
      history.replaceState(null, "", p);
    } catch {}
  }

  $("url").addEventListener("input", () => $("url").setCustomValidity(""));
  $("form").addEventListener("submit", e => { e.preventDefault(); load($("url").value); });
  $("restart").addEventListener("click", restart);
  playBtn.addEventListener("click", () => playing ? pause() : play());
  // Space = Start/Stop anywhere on the page (also in fullscreen), except while typing in a field.
  const typing = el => el.closest("input, textarea, select");
  document.addEventListener("keydown", e => {
    if (e.code !== "Space" || !deckBase || typing(e.target)) return;
    e.preventDefault();
    if (!e.repeat) playing ? pause() : play();
  });
  // Stop a focused button from also "clicking" on Space (buttons fire on keyup)
  document.addEventListener("keyup", e => {
    if (e.code === "Space" && deckBase && !typing(e.target)) e.preventDefault();
  });
  // Don't leave focus on a button after clicking it
  document.querySelectorAll("header button").forEach(b => b.addEventListener("click", () => b.blur()));
  const canFs = !!(stage.requestFullscreen || stage.webkitRequestFullscreen) && (document.fullscreenEnabled ?? document.webkitFullscreenEnabled ?? true);
  if (!canFs) $("fs").hidden = true;
  $("fs").addEventListener("click", () => {
    const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (req) Promise.resolve(req.call(stage)).catch(() => {});
    play(); // fullscreen starts the show
  });
  // Leaving fullscreen pauses the show
  const onFsChange = () => { if (!(document.fullscreenElement || document.webkitFullscreenElement)) pause(); };
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
  $("share")?.addEventListener("click", async () => {
    const link = location.href, btn = $("share");
    try { await navigator.clipboard.writeText(link); btn.textContent = "Link copied"; }
    catch { $("url").value = link; $("url").select(); btn.textContent = "Copy from field"; }
    setTimeout(() => btn.textContent = "Copy share link", 2000);
  });
  $("hud").addEventListener("change", () => { if (deckBase) hudBox.hidden = !$("hud").checked; });
  ["delay", "count"].forEach(id => $(id).addEventListener("change", () => { updateFormat(); restart(); }));

  // Load from ?deck= (paused, waits for play)
  const q = new URLSearchParams(location.search);
  if (q.get("sec")) $("delay").value = q.get("sec");
  if (q.get("n")) $("count").value = q.get("n");
  updateFormat();
  if (q.get("deck")) { $("url").value = q.get("deck"); load(q.get("deck")); }

  // expose for testing
  window.__toEmbed = (raw, delaySec) => {
    const b = toBase(raw);
    return b && `${b}?start=true&loop=false&delayms=${delaySec * 1000}`;
  };
})();
</script>
</body>
</html>
